<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>포토 블로그</title><style>body{font-family:sans-serif;max-width:900px;margin:30px auto;padding:0 16px}article{border-bottom:1px solid #ddd;padding:16px 0}img{max-width:100%;max-height:420px}</style></head>
<body><h1>포토 블로그</h1><p><a href="/api_root/Post/">REST API JSON 보기</a> | <a href="/post/new/">새 게시물 작성</a> | <a href="/admin/">관리자</a></p>
{% for post in posts %}<article><h2>{{ post.title }}</h2><p>{{ post.text|linebreaksbr }}</p>{% if post.image %}<img src="{{ post.image.url }}" alt="게시물 이미지">{% endif %}<p>작성자: {{ post.author }} / 게시일: {{ post.published_date }}</p></article>{% empty %}<p>등록된 게시물이 없습니다. 관리자에서 게시물을 등록하거나 API를 사용하세요.</p>{% endfor %}
</body></html>
